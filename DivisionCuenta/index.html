<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>División-Cuenta (F.L)</title>
</head>
<body>
    <h1>Calcular Cuenta y Propina</h1>
    <form id="cuentaForm">
        <div>
            <label for="subtotal">Total de la cuenta ($):</label>
            <input type="number" id="subtotal" min="0" step="0.01" required placeholder="Ej. 45.50">
        </div>
        <br>
        <div>
            <label for="propinaPorcentaje">Porcentaje de propina (%):</label>
            <input type="number" id="propinaPorcentaje" min="0" step="1" required placeholder="Ej. 10">
        </div>
        <br>
        <div>
            <label for="personas">Número de personas:</label>
            <input type="number" id="personas" min="1" step="1" required placeholder="Ej. 3">
        </div>
        <br>
        <button type="submit">Calcular División</button>
    </form>
    <div id="resultado"></div>
    <script src="app.js" defer></script>
</body>
</html>
