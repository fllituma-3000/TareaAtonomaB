<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio-Notas(F.L)</title>
</head>
<body>
    <h1>Calculadora de Promedio</h1>
    <form id="promedioForm">
        <div>
            <label for="nota1">Nota 1 (sobre 10):</label>
            <input type="number" id="nota1" min="0" max="10" step="0.01" required placeholder="Ej. 8.5">
        </div>
        <br>
        <div>
            <label for="nota2">Nota 2 (sobre 10):</label>
            <input type="number" id="nota2" min="0" max="10" step="0.01" required placeholder="Ej. 9.0">
        </div>
        <br>
        <div>
            <label for="nota3">Nota 3 (sobre 10):</label>
            <input type="number" id="nota3" min="0" max="10" step="0.01" required placeholder="Ej. 7.5">
        </div>
        <br>
        <button type="submit">Calcular Promedio</button>
    </form>
    <div id="resultado"></div>
    <script src="app.js"></script>
</body>
</html>
